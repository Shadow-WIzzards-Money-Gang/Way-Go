# Spring
spring.application.name=waygo
server.port=${PORT:8080}

# CORS
cors.origens-permitidas=${CORS_ORIGENS_PERMITIDAS:*}

# Database
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_NAME:FREEPDB1}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:app123}
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=64

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Integracao com Trilhos Agora
trilhos-agora.url=${TRILHOS_AGORA_URL:https://api.trilhosagora.com.br/v1}
trilhos-agora.api-key=${TRILHOS_AGORA_API_KEY:}
trilhos-agora.intervalo=${TRILHOS_AGORA_INTERVALO:PT2M}
trilhos-agora.agendamento-habilitado=${TRILHOS_AGORA_AGENDAMENTO:true}
trilhos-agora.recarga-cache=${TRILHOS_AGORA_RECARGA_CACHE:PT30M}

spring.cloud.openfeign.client.config.trilhos-agora.connect-timeout=5000
spring.cloud.openfeign.client.config.trilhos-agora.read-timeout=10000

# Rotas
rotas.criterio-padrao=${ROTAS_CRITERIO_PADRAO:EQUILIBRADO}
rotas.penalidade-baldeacao=${ROTAS_PENALIDADE_BALDEACAO:PT3M}
rotas.fator-lentidao=${ROTAS_FATOR_LENTIDAO:1.5}
rotas.recarga-grafo=${ROTAS_RECARGA_GRAFO:PT6H}

# Seguranca (JWT)
seguranca.jwt.segredo=${JWT_SEGREDO:segredo}
seguranca.jwt.expiracao.minutos=${JWT_EXPIRACAO_MINUTOS:60}
seguranca.jwt.emissor=${JWT_EMISSOR:waygo}
